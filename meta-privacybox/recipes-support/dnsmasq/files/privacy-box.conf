# Privacy Box dnsmasq configuration
# Enable query logging for per-device tracking
log-queries
log-facility=/var/log/pihole/pihole.log

# Enable DHCP for device identification (example range; adjust to your LAN)
# Note: Router IP should match your actual gateway
dhcp-range=192.168.68.100,192.168.68.200,12h
dhcp-option=option:router,192.168.68.1
# DNS server should point to this device (dnsmasq itself)
dhcp-option=option:dns-server,192.168.68.116

# Store DHCP leases for device tracking
dhcp-leasefile=/var/lib/misc/dnsmasq.leases

# Block known tracker domains (will be populated by blocklist updater)
addn-hosts=/etc/privacy-box/blocklist.txt

